<!-- Document Type Declaration -->
<!DOCTYPE html>

<!-- HTML Tag -->
<html lang="en">

  <!-- Head Section -->
  <head>

      <!-- Character Set -->
      <meta charset="UTF-8">

      <!-- Viewport -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!-- Favicon -->
      <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">

      <!-- Stylesheet -->
      <link rel="stylesheet" href="../styles/index.css">

      <!-- Title -->
      <title>
          NFT preview card
      </title>

  </head>

  <!-- Body Section -->
  <body>

    <!-- NFT -->
    <main>

        <!-- NFT Card -->
        <article>

            <!-- NFT Image -->
            <picture>
                <img src="/assets/images/icon-view.svg" alt="View">
                <img src="../../assets/images/image-equilibrium.jpg" alt="Equilibrium image">
            </picture>

            <!-- NFT Details -->
            <section>

                <!-- NFT Title -->
                <h3>
                    Equilibrium #3429
                </h3>

                <!-- NFT Description -->
                <p>
                    Our Equilibrium collection promotes balance and calm.
                </p>

                <!-- NFT Information -->
                 <ul>

                  <!-- NFT Decimal -->
                  <li>

                    <img src="/assets/images/icon-ethereum.svg" alt="Ethereum">

                    <span>
                      0.041 ETH
                    </span>

                  </li>

                  <!-- NFT Due Date -->
                  <li>

                    <img src="/assets/images/icon-clock.svg" alt="Clock">

                    <span>
                      3 days left
                    </span>
                    
                  </li>

                 </ul>

            </section>

            <!-- Horizontal Rule -->
             <hr>

            <!-- NFT Author -->
            <address>

                <!-- NFT Author Avatar -->
                <img src="../../assets/images/image-avatar.png" alt="Jules Wyvern">

                <!-- NFT Author Name -->
                Creation of <span>Jules Wyvern</span>

            </address>

        </article>

    </main>

</body>

</html>
